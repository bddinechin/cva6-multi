# docbuild.conf — how cva6-multi builds its documents. See ~/docbuild/README.md.

DOC_ABOUT="cva6-multi — stand-alone coherent quadcore RISC-V cluster"

# Kept out of the tree: this is a public repo, and a committed PDF would churn a binary on
# every edit of the Markdown that is the actual master.
PDF_OUTDIR="docs/pdf"
HTML_OUTDIR=""

fileset_default() {
  echo "docs/cluster-plan.md"
}

fileset_all() {
  find "$PROJECT/docs" -maxdepth 1 -name '*.md' | sort
}
